<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="mascotte.js"></script>
<script src="common.js"></script>
<style>
  /* QUIZ A/B/C: tre finali possibili, uno solo è la battuta */
  #hook { position: absolute; top: 200px; left: 70px; right: 70px; font-family: var(--f-titolo); font-weight: 700; font-size: 80px; line-height: 1.02; letter-spacing: -2px; text-wrap: balance; transform-origin: 0% 50%; }
  #qbox { position: absolute; top: 560px; left: 70px; right: 70px; }
  #num { font-family: var(--f-mono); font-size: 30px; letter-spacing: 3px; margin-bottom: 18px; opacity: .85; }
  #q { font-family: var(--f-titolo); font-weight: 700; font-size: 84px; line-height: 1.02; letter-spacing: -2px; text-wrap: balance; }
  #opts { position: absolute; top: 900px; left: 70px; right: 70px; display: flex; flex-direction: column; gap: 30px; }
  .opt { display: flex; align-items: center; gap: 28px; background: var(--brina); color: var(--inchiostro); border: 7px solid var(--inchiostro); border-radius: 36px;
    box-shadow: 12px 12px 0 var(--inchiostro); padding: 22px 30px; min-height: 150px; transform-origin: 0% 50%; position: relative; }
  .opt .k { flex: 0 0 auto; width: 96px; height: 96px; border-radius: 26px; background: var(--cobalto); color: #fff; display: grid; place-items: center;
    font-family: var(--f-logo); font-size: 50px; padding-top: 10px; border: 5px solid var(--inchiostro); }
  .opt .tx { font-family: var(--f-titolo); font-weight: 700; font-size: 54px; line-height: 1.05; letter-spacing: -1px; }
  .opt.ok { background: var(--ghiacciolo); color: #fff; }
  .opt.ok .k { background: var(--limone); color: var(--inchiostro); }
  .opt.no { opacity: .35; }
  .opt .x { position: absolute; right: 30px; top: 50%; margin-top: -40px; width: 80px; height: 80px; }
  #ring { position: absolute; right: 70px; top: 520px; width: 170px; height: 170px; z-index: 5; }
  #ringN { position: absolute; right: 70px; top: 520px; width: 170px; height: 170px; display: grid; place-items: center; font-family: var(--f-logo); font-size: 70px; padding-top: 12px; z-index: 6; }
  #ask { position: absolute; left: 70px; top: 1470px; font-family: var(--f-titolo); font-weight: 700; font-size: 44px; background: var(--inchiostro); padding: 12px 26px; border-radius: 999px; }
  #qm { position: absolute; right: 60px; top: 1430px; z-index: 7; }
</style>
</head>
<body>
  <div id="hook"></div>
  <div id="qbox"><div id="num"></div><div id="q"></div></div>
  <svg id="ring" viewBox="0 0 170 170"><circle cx="85" cy="85" r="72" fill="var(--inchiostro)"/><circle id="arc" cx="85" cy="85" r="64" fill="none" stroke="var(--limone)" stroke-width="16" stroke-linecap="round" transform="rotate(-90 85 85)" stroke-dasharray="402" stroke-dashoffset="0"/></svg>
  <div id="ringN"></div>
  <div id="opts"></div>
  <div id="ask">Scrivi A, B o C 👇</div>
  <div id="qm"></div>
<script>
let R, Q = [], INTRO = 1.3, ENDS = 0, THINK = 4.0, lastE = '';
const X = '<svg class="x" viewBox="0 0 80 80"><path d="M14 14 L66 66 M66 14 L14 66" stroke="#0A0F3D" stroke-width="14" stroke-linecap="round"/></svg>';

function setup(reel, handle) {
  R = reel; baseLayer('QUIZ A/B/C', handle, reel.fine);
  $('hook').innerHTML = hlWords(reel.hook);
  let t = INTRO; const sounds = [{ t: 0.02, k: 'slam' }];
  reel.domande.forEach((d, i) => {
    const start = t, optsIn = start + 0.5, timer = optsIn + 0.9, reveal = timer + THINK, end = reveal + 2.2;
    Q.push({ i, ...d, start, optsIn, timer, reveal, end });
    sounds.push({ t: start, k: 'whoosh' });
    [0, 1, 2].forEach(k => sounds.push({ t: optsIn + k * 0.18, k: 'pop' }));
    for (let s = 0; s < 4; s++) sounds.push({ t: timer + s, k: 'tick' });
    sounds.push({ t: reveal, k: 'buzz' }, { t: reveal + 0.35, k: 'ice' });
    t = end;
  });
  ENDS = t; sounds.push({ t: ENDS, k: 'slam' });
  return { duration: ENDS + 2.5, sounds };
}

function setTime(t) {
  bgTick(t);
  if (endCard(t, ENDS)) return;
  $('hook').style.transform = `scale(${1 + 0.07 * Math.sin(cl(t / 0.3) * Math.PI)})`;
  const e = Q.find(x => t >= x.start && t < x.end) || (t < INTRO ? Q[0] : Q[Q.length - 1]);
  const tin = ease((t - e.start) / 0.3), tout = ease((t - (e.end - 0.25)) / 0.25);
  const slide = t < INTRO ? 0 : (e.i > 0 ? (1 - tin) * 1200 : 0) - tout * 1200;
  $('num').textContent = `DOMANDA ${pad2(e.i + 1)}/${pad2(Q.length)}`;
  $('q').textContent = e.q;
  $('qbox').style.transform = `translateX(${slide}px)`;
  const wrong = t >= e.reveal, okOn = t >= e.reveal + 0.35, pr = t - (e.reveal + 0.35);
  $('opts').innerHTML = e.opzioni.map((o, k) => {
    const p = (t - (e.optsIn + k * 0.18)) / 0.3; const isOk = k === e.giusta;
    let cls = 'opt' + (okOn && isOk ? ' ok' : '') + (wrong && !isOk ? ' no' : '');
    let sc = (t < INTRO ? 1 : back(p)) * (okOn && isOk ? 1 + 0.08 * Math.sin(cl(pr / 0.3) * Math.PI) : 1);
    return `<div class="${cls}" style="transform:translateX(${slide}px) scale(${sc});opacity:${t < INTRO ? 1 : cl(p * 3)}"><div class="k">${'ABC'[k]}</div><div class="tx">${o}</div>${wrong && !isOk ? X : ''}</div>`;
  }).join('');
  // timer ad anello
  const tp = cl((t - e.timer) / THINK);
  const show = t >= e.timer && t < e.reveal;
  $('ring').style.display = $('ringN').style.display = show ? 'block' : 'none';
  $('ringN').style.display = show ? 'grid' : 'none';
  $('arc').style.strokeDashoffset = 402 * tp;
  $('ringN').textContent = Math.max(1, Math.ceil(THINK - (t - e.timer)));
  $('ask').style.opacity = t >= INTRO && !okOn ? 1 : 0;
  // mascotte e congelamento sulla risposta giusta
  const expr = okOn ? 'gelato' : 'furbo';
  if (lastE !== expr) { $('qm').innerHTML = gelo(expr, 180); lastE = expr; }
  $('qm').style.transform = `translateY(0px) rotate(${okOn ? Math.sin(t * 60) * 6 : -8 + Math.sin(t * 3) * 4}deg)`;
  const shake = freeze(okOn ? pr : null, [560, 760]);
  $('opts').style.marginLeft = shake + 'px';
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
