<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="mascotte.js"></script>
<script src="common.js"></script>
<style>
  /* CLASSIFICA DEL GELO: 5 battute dalla più tiepida alla più glaciale */
  #hook { position: absolute; top: 200px; left: 70px; right: 70px; font-family: var(--f-titolo); font-weight: 700; font-size: 76px; line-height: 1.02; letter-spacing: -2px; text-wrap: balance; transform-origin: 0% 50%; }
  #card { position: absolute; left: 60px; right: 60px; top: 450px; height: 580px; background: var(--brina); color: var(--inchiostro);
    border-radius: var(--r-card); border: 7px solid var(--inchiostro); box-shadow: 16px 16px 0 var(--inchiostro); overflow: hidden; z-index: 4; }
  #rank { position: absolute; top: 34px; left: 40px; font-family: var(--f-logo); font-size: 70px; line-height: 1.25; padding: 4px 26px 0; border-radius: 22px; border: 6px solid var(--inchiostro); }
  #rl { position: absolute; top: 60px; left: 230px; font-family: var(--f-mono); font-size: 28px; letter-spacing: 2px; color: #5568A8; }
  #q { position: absolute; top: 170px; left: 40px; right: 40px; font-family: var(--f-titolo); font-weight: 700; font-size: 64px; line-height: 1.05; letter-spacing: -1.5px; text-wrap: balance; }
  #a { position: absolute; left: 30px; right: 30px; bottom: 30px; min-height: 200px; background: var(--punch); color: var(--punchfg); border: 7px solid var(--inchiostro); border-radius: 36px;
    display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--f-titolo); font-weight: 700; font-size: 68px; line-height: 1.02; letter-spacing: -1.5px; padding: 24px 34px; text-wrap: balance; }
  #lad { position: absolute; left: 60px; right: 60px; top: 1110px; display: flex; flex-direction: column; gap: 10px; }
  .row { height: 70px; display: flex; align-items: center; gap: 14px; }
  .row .n { width: 92px; height: 70px; border-radius: 18px; border: 5px solid var(--inchiostro); display: grid; place-items: center; font-family: var(--f-logo); font-size: 34px; padding-top: 6px; }
  .row .s { flex: 1; height: 70px; border-radius: 18px; border: 5px dashed var(--fg); opacity: .95; display: flex; align-items: center; padding: 0 24px;
    font-family: var(--f-titolo); font-weight: 700; font-size: 36px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform-origin: 0% 50%; }
  .row .s.on { border: 5px solid var(--inchiostro); box-shadow: 0 6px 0 var(--inchiostro); }
  .row .g { width: 120px; font-family: var(--f-mono); font-size: 26px; text-align: right; letter-spacing: 1px; }
  #scale { position: absolute; right: 64px; top: 1066px; font-family: var(--f-mono); font-size: 22px; letter-spacing: 2px; opacity: .8; }
  #cm2 { position: absolute; right: 24px; top: 400px; z-index: 6; }
</style>
</head>
<body>
  <div id="hook"></div>
  <div id="card"><div id="rank"></div><div id="rl"></div><div id="q"></div><div id="a"></div></div>
  <div id="scale">↑ GLACIALE</div>
  <div id="lad"></div>
  <div id="cm2"></div>
<script>
let R, E = [], INTRO = 1.4, ENDS = 0, lastE = '';
const RC = { 1: ['var(--inchiostro)', '#fff'], 2: ['var(--ghiacciolo)', '#fff'], 3: ['var(--limone)', 'var(--inchiostro)'], 4: ['var(--menta)', 'var(--inchiostro)'], 5: ['var(--brina)', 'var(--inchiostro)'] };
const NAMES = { 1: 'GLACIALE', 2: 'POLARE', 3: 'FREDDA', 4: 'FRESCA', 5: 'TIEPIDA' };

function setup(reel, handle) {
  R = reel; baseLayer('CLASSIFICA DEL GELO', handle, reel.fine);
  $('hook').innerHTML = hlWords(reel.hook);
  let t = INTRO; const sounds = [{ t: 0.02, k: 'slam' }];
  // le battute arrivano dalla posizione 5 alla 1
  reel.battute.forEach((b, i) => {
    const pos = 5 - i;
    const start = t, reveal = start + Math.min(2.4, 1.5 + b[0].length * 0.018), place = reveal + Math.min(2.4, 1.6 + b[1].length * 0.025), end = place + 0.7;
    E.push({ i, pos, q: b[0], a: b[1], s: b[2], start, reveal, place, end });
    sounds.push({ t: start, k: 'whoosh' }, { t: reveal, k: pos <= 2 ? 'ice' : 'pop' }, { t: place, k: 'ding' });
    t = end;
  });
  ENDS = t + 1.6; sounds.push({ t: ENDS, k: 'slam' });
  return { duration: ENDS + END_LEN, sounds };
}

function setTime(t) {
  bgTick(t);
  if (endCard(t, ENDS)) return;
  $('hook').style.transform = `scale(${1 + 0.07 * Math.sin(cl(t / 0.3) * Math.PI)})`;
  const e = E.find(x => t >= x.start && t < x.end) || (t < INTRO ? E[0] : E[E.length - 1]);
  const finale = t >= E[E.length - 1].end;
  // card della battuta corrente
  const card = $('card');
  const cin = t < INTRO ? 1 : (e.i > 0 ? ease((t - e.start) / 0.3) : 1);
  const toSlot = ease((t - e.place) / 0.45);
  card.style.display = finale ? 'none' : 'block';
  card.style.transform = `translate(0, ${(1 - cin) * 1300}px) scale(${1 - 0.7 * toSlot}) rotate(-1deg)`;
  card.style.transformOrigin = '50% 140%'; card.style.opacity = 1 - toSlot;
  const [bg, fg] = RC[e.pos];
  $('rank').textContent = '#' + e.pos; $('rank').style.background = bg; $('rank').style.color = fg;
  $('rl').textContent = 'POSIZIONE ' + e.pos + ' · ' + NAMES[e.pos];
  $('q').textContent = e.q; $('a').textContent = e.a;
  const revealed = t >= e.reveal, pr = t - e.reveal;
  $('a').style.display = revealed ? 'flex' : 'none';
  $('a').style.transform = `rotate(-2deg) scale(${0.3 + 0.7 * back(pr / 0.32)})`;
  // congelamento forte solo per le prime due posizioni
  const shake = freeze(revealed && t < e.place && e.pos <= 2 ? pr : null, [600, 980]);
  card.style.marginLeft = shake + 'px';
  // scala: righe dalla 1 (in alto) alla 5
  $('lad').innerHTML = [1, 2, 3, 4, 5].map(pos => {
    const it = E.find(x => x.pos === pos); const on = t >= it.place; const p = (t - it.place) / 0.35;
    const [b2, f2] = RC[pos];
    const sc = on ? back(p) : 1;
    return `<div class="row"><div class="n" style="background:${b2};color:${f2}">#${pos}</div>
      <div class="s${on ? ' on' : ''}" style="${on ? `background:${b2};color:${f2};` : ''}transform:scaleX(${sc})">${on ? it.a : ''}</div>
      <div class="g">${on ? it.s + '/10' : ''}</div></div>`;
  }).join('');
  
  // mascotte
  const expr = finale ? 'ride' : (revealed && e.pos <= 2 ? 'gelato' : 'furbo');
  if (lastE !== expr) { $('cm2').innerHTML = gelo(expr, 200); lastE = expr; }
  $('cm2').style.transform = finale ? `translate(-380px, 260px) scale(1.6) rotate(${Math.sin(t * 6) * 6}deg)` :
    `translateY(${(1 - cin) * 1300}px) rotate(${expr === 'gelato' ? Math.sin(t * 60) * 6 : 10}deg)`;
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
