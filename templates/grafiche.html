<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="mascotte.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { font-family: var(--f-testo); }
  .s { position: absolute; inset: 0; overflow: hidden; display: none; }
  .s.on { display: block; }
  .grid { position: absolute; inset: 0; background-image:
      linear-gradient(rgba(255,255,255,0.08) 3px, transparent 3px),
      linear-gradient(90deg, rgba(255,255,255,0.08) 3px, transparent 3px); background-size: 120px 120px; }
  .grid.dark { background-image: linear-gradient(rgba(10,15,61,0.06) 3px, transparent 3px), linear-gradient(90deg, rgba(10,15,61,0.06) 3px, transparent 3px); }
  .logo { position: absolute; top: 64px; left: 72px; font-family: var(--f-logo); font-size: 30px; letter-spacing: 1px; }
  .pg { position: absolute; top: 64px; right: 72px; font-family: var(--f-mono); font-size: 26px; letter-spacing: 2px; }
  .big { font-family: var(--f-titolo); font-weight: 700; letter-spacing: -3px; line-height: 0.98; text-wrap: balance; }
  .hl { background: var(--limone); color: var(--inchiostro); padding: 0 18px; border-radius: 18px; display: inline-block; transform: rotate(-2deg); }
  .pill { position: absolute; font-family: var(--f-titolo); font-weight: 700; font-size: 36px; padding: 14px 30px; border-radius: 999px; border: 5px solid var(--inchiostro); box-shadow: 0 8px 0 var(--inchiostro); }
  .mono { font-family: var(--f-mono); letter-spacing: 2px; }
  .m { position: absolute; }
  .meter { position: absolute; left: 72px; width: 560px; bottom: 96px; }
  .meter .t { font-family: var(--f-mono); font-size: 28px; letter-spacing: 2px; margin-bottom: 14px; }
  .meter .tr { height: 36px; border-radius: 18px; background: #fff; border: 5px solid var(--inchiostro); overflow: hidden; }
  .meter .f { height: 100%; background: repeating-linear-gradient(-45deg, var(--cobalto) 0 22px, #4D66FF 22px 44px); }
  .crack { position: absolute; inset: 0; }
  .blank { display: inline-block; min-width: 380px; border-bottom: 14px solid var(--ghiacciolo); transform: translateY(-10px); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const CRACK = `<svg class="crack" viewBox="0 0 1080 1350" preserveAspectRatio="none"><g stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
  <path d="M0 30 L130 80 L190 40 L300 110 L360 80"/><path d="M1080 150 L950 210 L900 160 L770 230"/>
  <path d="M0 1200 L140 1140 L200 1230 L330 1160"/><path d="M1080 1260 L940 1190 L880 1270 L740 1200"/></g></svg>`;
const hl = (s) => s.replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
const pad = (n) => String(n).padStart(2, '0');
let SL = [];

function slide(html, bg, color) {
  const d = document.createElement('div'); d.className = 's';
  d.style.background = bg; d.style.color = color; d.innerHTML = html;
  document.getElementById('root').appendChild(d); SL.push(d); return d;
}

function setupCarosello(c, handle) {
  const N = c.battute.length; const total = 2 + N * 2;
  // copertina
  slide(`<div class="grid"></div><div class="logo">BATTUTE GELATE</div><div class="pg">01/${pad(total)}</div>
    <div class="mono" style="position:absolute;top:220px;left:72px;font-size:28px;background:var(--inchiostro);padding:8px 16px;border-radius:10px">CAROSELLO · ${N} BATTUTE</div>
    <div class="big" style="position:absolute;top:310px;left:72px;right:72px;font-size:136px">${hl(c.copertina)}</div>
    <div style="position:absolute;top:880px;left:72px;right:420px;font-family:var(--f-titolo);font-size:44px;line-height:1.15;opacity:.92">${c.sottotitolo}</div>
    <div class="m" style="right:60px;bottom:170px;transform:rotate(10deg)">${gelo('furbo', 330)}</div>
    <div class="pill" style="left:72px;bottom:90px;background:var(--ghiacciolo);color:#fff">Scorri →</div>`,
    'var(--cobalto)', '#fff');
  c.battute.forEach((b, i) => {
    const n = 2 + i * 2;
    slide(`<div class="grid dark"></div><div class="logo">BATTUTE GELATE</div><div class="pg">${pad(n)}/${pad(total)}</div>
      <div class="mono" style="position:absolute;top:230px;left:72px;font-size:32px;color:#5568A8">BATTUTA ${pad(i + 1)}/${pad(N)}</div>
      <div class="big" style="position:absolute;top:300px;left:72px;right:72px;font-size:112px">${b[0]}</div>
      <div class="m" style="right:70px;bottom:230px;transform:rotate(-8deg)">${gelo('furbo', 260)}</div>
      <div class="pill" style="left:72px;bottom:100px;background:var(--limone);color:var(--inchiostro)">La risposta è qui →</div>`,
      'var(--brina)', 'var(--inchiostro)');
    slide(`<div class="grid"></div>${CRACK}<div class="logo">BATTUTE GELATE</div><div class="pg">${pad(n + 1)}/${pad(total)}</div>
      <div style="position:absolute;top:210px;left:72px;right:72px;font-family:var(--f-titolo);font-size:44px;line-height:1.15;opacity:.85">${b[0]}</div>
      <div class="big" style="position:absolute;top:420px;left:72px;right:72px;font-size:124px">${b[1]}</div>
      <div class="m" style="right:60px;bottom:90px">${gelo('gelato', 250)}</div>
      <div style="position:absolute;right:300px;bottom:270px;font-family:var(--f-logo);font-size:80px;color:var(--limone);-webkit-text-stroke:7px var(--inchiostro);paint-order:stroke fill;transform:rotate(-10deg)">BRRR!</div>
      <div class="meter"><div class="t">GELO ${b[2]}/10</div><div class="tr"><div class="f" style="width:${b[2] * 10}%"></div></div></div>`,
      'var(--ghiacciolo)', '#fff');
  });
  // chiusura
  slide(`<div class="grid dark"></div><div class="logo">BATTUTE GELATE</div><div class="pg">${pad(total)}/${pad(total)}</div>
    <div class="big" style="position:absolute;top:220px;left:72px;right:72px;font-size:112px">${c.fine}</div>
    <div style="position:absolute;top:610px;left:72px;display:flex;gap:22px">${c.battute.map((_, i) => `<div style="width:120px;height:120px;border-radius:30px;background:#fff;border:6px solid var(--inchiostro);box-shadow:0 8px 0 var(--inchiostro);display:grid;place-items:center;font-family:var(--f-titolo);font-weight:700;font-size:64px">${i + 1}</div>`).join('')}</div>
    <div class="m" style="right:70px;bottom:200px;transform:rotate(8deg)">${gelo('ride', 300)}</div>
    <div class="pill" style="left:72px;bottom:110px;background:var(--cobalto);color:#fff">Salva e segui ${handle}</div>`,
    'var(--limone)', 'var(--inchiostro)');
  return SL.length;
}

function setupPost(p, handle) {
  slide(`<div class="grid dark"></div>
    <div style="position:absolute;left:0;right:0;top:0;height:250px;background:var(--cobalto);border-bottom:7px solid var(--inchiostro)"></div>
    <div class="logo" style="color:#fff">BATTUTE GELATE</div>
    <div style="position:absolute;top:130px;left:72px;font-family:var(--f-logo);font-size:56px;color:var(--limone);-webkit-text-stroke:5px var(--inchiostro);paint-order:stroke fill">COMPLETA LA BATTUTA</div>
    <div class="big" style="position:absolute;top:360px;left:72px;right:72px;font-size:96px">${p.domanda}</div>
    <div class="big" style="position:absolute;top:760px;left:72px;right:72px;font-size:96px;color:var(--cobalto)">${p.inizio} <span class="blank"></span>${p.fine_frase}</div>
    <div class="m" style="right:60px;bottom:90px;transform:rotate(-8deg)">${gelo('furbo', 270)}</div>
    <div class="pill" style="left:72px;bottom:170px;background:var(--ghiacciolo);color:#fff">Scrivila nei commenti 👇</div>
    <div class="mono" style="position:absolute;left:76px;bottom:90px;font-size:26px;color:#5568A8">RISPOSTA NEL PRIMO COMMENTO</div>`,
    'var(--brina)', 'var(--inchiostro)');
  showSlide(0);
}

function showSlide(i) { SL.forEach((s, k) => s.classList.toggle('on', k === i)); }
window.setupCarosello = setupCarosello; window.setupPost = setupPost; window.showSlide = showSlide;
</script>
</body>
</html>
