<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="mascotte.js"></script>
<script src="common.js"></script>
<style>
  /* PLINKO: una pallina cade tra i pioli e finisce in una casella. Chi guarda indovina il numero. */
  body { background: #070B2E; color: #fff; }
  #bgc { display: none; }
  #sky { position: absolute; inset: 0; background:
    radial-gradient(ellipse 900px 900px at 50% 55%, rgba(31,59,255,0.45), rgba(31,59,255,0) 70%),
    radial-gradient(ellipse 600px 500px at 85% 10%, rgba(79,240,192,0.16), rgba(79,240,192,0) 70%),
    radial-gradient(ellipse 700px 600px at 10% 95%, rgba(255,79,154,0.2), rgba(255,79,154,0) 70%), #070B2E; }
  #grain2 { position: absolute; inset: 0; opacity: .22; mix-blend-mode: overlay; z-index: 2; }
  #cv { position: absolute; left: 0; top: 0; z-index: 3; }
  #top { position: absolute; top: 160px; left: 0; right: 0; text-align: center; z-index: 5; }
  #k { display: inline-block; font-family: var(--f-mono); font-size: 28px; letter-spacing: 6px; color: var(--menta); padding: 10px 22px; border: 2px solid rgba(79,240,192,.5); border-radius: 999px; background: rgba(79,240,192,.08); }
  #h { margin-top: 22px; font-family: var(--f-titolo); font-weight: 700; font-size: 92px; line-height: .98; letter-spacing: -4px; text-shadow: 0 0 40px rgba(31,59,255,.9); padding: 0 50px; text-wrap: balance; }
  #h em { font-style: normal; background: linear-gradient(90deg, #4FF0C0, #FFD93D); -webkit-background-clip: text; color: transparent; }
  #out { position: absolute; left: 60px; right: 60px; top: 1700px; height: 140px; border-radius: 36px; z-index: 6; display: flex; align-items: center; justify-content: center; text-align: center;
    font-family: var(--f-titolo); font-weight: 700; font-size: 54px; line-height: 1.05; padding: 0 40px; background: rgba(255,255,255,.06); border: 2px solid rgba(255,255,255,.18); }
  #ask { position: absolute; left: 0; right: 0; top: 1868px; text-align: center; font-family: var(--f-titolo); font-weight: 700; font-size: 38px; color: rgba(255,255,255,.8); z-index: 6; }
  .logo { color: #fff !important; top: 80px !important; }
</style>
</head>
<body>
  <div id="sky"></div>
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="grain2"></div>
  <div id="top"><div id="k"></div><div id="h"></div></div>
  <div id="out"></div>
  <div id="ask"></div>
<script>
$('grain2').style.backgroundImage = GRAIN;
const ROWS = 10, SP = 96, TOPY = 580, PR = 12, BR = 32, SLOT_Y = 1530, NS = 7, FPS = 30, SUB = 8;
const SLOT_W = 920 / NS, X0 = 80;
const SCOL = ['#FF4F9A', '#FFD93D', '#4FF0C0', '#2F55FF', '#4FF0C0', '#FFD93D', '#FF4F9A'];
let R, PEGS = [], D = [], ENDS = 0, FACE = null, flashPeg = {};
for (let r = 0; r < ROWS; r++) { const n = r % 2 ? 9 : 10; const off = r % 2 ? SP / 2 : 0;
  for (let k = 0; k < n; k++) PEGS.push({ x: 540 - 4.5 * SP + off + k * SP, y: TOPY + r * 88 }); }

function drop(seed, x0) {
  const r = rng(seed), g = 3000, dt = 1 / (FPS * SUB);
  let b = { x: x0 + (r() - .5) * 20, y: 470, vx: (r() - .5) * 60, vy: 0 }; const fr = [], hits = [];
  for (let f = 0; f < 8 * FPS; f++) {
    for (let s = 0; s < SUB; s++) {
      b.vy += g * dt; b.x += b.vx * dt; b.y += b.vy * dt;
      for (let i = 0; i < PEGS.length; i++) { const p = PEGS[i], dx = b.x - p.x, dy = b.y - p.y, d = Math.hypot(dx, dy);
        if (d < BR + PR) { const nx = dx / d, ny = dy / d, vn = b.vx * nx + b.vy * ny;
          if (vn < 0) { b.vx -= 1.4 * vn * nx; b.vy -= 1.4 * vn * ny; b.vx += (r() - .5) * 90; hits.push({ t: (f + s / SUB) / FPS, i }); }
          b.x = p.x + nx * (BR + PR); b.y = p.y + ny * (BR + PR); } }
      if (b.x < X0 + BR) { b.x = X0 + BR; b.vx = Math.abs(b.vx) * .6; } if (b.x > X0 + 920 - BR) { b.x = X0 + 920 - BR; b.vx = -Math.abs(b.vx) * .6; }
      if (b.y > SLOT_Y + 40) { b.y = SLOT_Y + 40; b.vy = 0; b.vx *= 0.8; }
    }
    fr.push([b.x, b.y]);
    if (b.y >= SLOT_Y + 40) break;
  }
  const slot = Math.max(0, Math.min(NS - 1, Math.floor((b.x - X0) / SLOT_W)));
  return { fr, hits, slot };
}

function setup(reel, handle) {
  R = reel; baseLayer('PLINKO', handle, reel.fine, { noProg: true });
  $('k').textContent = 'PLINKO N.' + (reel.numero || 1);
  $('h').innerHTML = (reel.hook || 'Dove cade *Gelo*?').replace(/\*([^*]+)\*/g, '<em>$1</em>');
  $('ask').textContent = reel.chiedi || 'Scrivi il numero prima che arrivi 👇';
  FACE = new Image(); FACE.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(gelo('sveglio', 200));
  let t = 0.6, seed = reel.seme || 1; const sounds = [{ t: 0.02, k: 'slam' }], used = new Set();
  (reel.lanci || 3) && Array.from({ length: reel.lanci || 3 }).forEach((_, i) => {
    let d; for (let k = 0; k < 200; k++, seed++) { d = drop(seed, 540 + (i - 1) * 30); if (!used.has(d.slot) && d.fr.length / FPS < 4.2) break; }
    used.add(d.slot); seed++;
    const start = t, land = t + d.fr.length / FPS;
    D.push({ i, ...d, start, land, end: land + 1.2 });
    let last = -1; d.hits.forEach((h, j) => { if (h.t - last > 0.06) { sounds.push({ t: start + h.t, k: 'n' + (7 - Math.min(7, Math.floor(PEGS[h.i].y - TOPY) / 88 * 0.7 | 0)) }); last = h.t; } });
    sounds.push({ t: land, k: 'ding' }, { t: land + 0.05, k: 'pop' });
    t = land + 1.2;
  });
  ENDS = t; sounds.push({ t: ENDS, k: 'slam' });
  return { duration: ENDS + END_LEN, sounds };
}

const cv = document.getElementById('cv'), cx = cv.getContext('2d');
function setTime(t) {
  if (endCard(t, ENDS)) return;
  cx.clearRect(0, 0, 1080, 1920);
  const e = D.find(x => t < x.end) || D[D.length - 1], lt = t - e.start, fi = Math.max(0, Math.min(e.fr.length - 1, Math.floor(lt * FPS)));
  const landed = t >= e.land, pl = t - e.land;
  // cornice
  cx.save(); cx.strokeStyle = 'rgba(234,246,255,.9)'; cx.lineWidth = 8; cx.shadowColor = '#7FA0FF'; cx.shadowBlur = 24;
  cx.beginPath(); cx.roundRect(X0 - 14, 470, 920 + 28, SLOT_Y + 145 - 470, 40); cx.stroke(); cx.restore();
  // pioli che si accendono quando vengono toccati
  const lit = {}; e.hits.forEach(h => { if (h.t <= lt && lt - h.t < 0.35) lit[h.i] = Math.max(lit[h.i] || 0, 1 - (lt - h.t) / 0.35); });
  PEGS.forEach((p, i) => { const l = lit[i] || 0;
    cx.save(); cx.shadowColor = l ? '#FFD93D' : '#7FA0FF'; cx.shadowBlur = 12 + l * 30;
    cx.beginPath(); cx.arc(p.x, p.y, PR + l * 5, 0, 6.2832); cx.fillStyle = l ? '#FFF6C9' : '#DDE6FF'; cx.fill(); cx.restore(); });
  // caselle
  for (let s = 0; s < NS; s++) {
    const x = X0 + s * SLOT_W, win = landed && s === e.slot, done = D.some(d => d.i < e.i && d.slot === s);
    cx.save(); cx.shadowColor = SCOL[s]; cx.shadowBlur = win ? 50 : 14;
    cx.fillStyle = win ? SCOL[s] : 'rgba(255,255,255,.06)'; cx.strokeStyle = SCOL[s]; cx.lineWidth = 4;
    cx.beginPath(); cx.roundRect(x + 6, SLOT_Y, SLOT_W - 12, 130, 18); cx.fill(); cx.stroke(); cx.restore();
    cx.fillStyle = win ? '#070B2E' : (done ? 'rgba(255,255,255,.35)' : '#fff'); cx.font = '700 54px Boldonse'; cx.textAlign = 'center';
    cx.fillText(String(s + 1), x + SLOT_W / 2, SLOT_Y + 92);
  }
  // pallina con scia
  for (let k = 8; k >= 1; k--) { const p = e.fr[Math.max(0, fi - k)]; cx.beginPath(); cx.arc(p[0], p[1], BR * (1 - k / 11), 0, 6.2832); cx.fillStyle = 'rgba(191,227,255,' + (0.06 * (9 - k)) + ')'; cx.fill(); }
  const p = e.fr[fi];
  cx.save(); cx.shadowColor = '#BFE3FF'; cx.shadowBlur = 40; cx.beginPath(); cx.arc(p[0], p[1], BR, 0, 6.2832); cx.fillStyle = '#EAF6FF'; cx.fill(); cx.restore();
  if (FACE.complete) cx.drawImage(FACE, p[0] - BR * 1.25, p[1] - BR * 1.3, BR * 2.5, BR * 2.5);
  // risultato
  const o = $('out'), lab = (R.caselle || [])[e.slot];
  if (landed) { o.textContent = lab ? `${e.slot + 1} · ${lab}` : `È CADUTA NEL ${e.slot + 1}!`; o.style.background = SCOL[e.slot]; o.style.color = e.slot === 3 ? '#fff' : '#070B2E';
    o.style.transform = `scale(${back(pl / 0.3)})`; }
  else { o.textContent = `LANCIO ${e.i + 1}/${D.length}`; o.style.background = 'rgba(255,255,255,.06)'; o.style.color = '#fff'; o.style.transform = 'none'; }
  $('flashAll').style.opacity = landed && pl < 0.12 ? 0.5 * (1 - pl / 0.12) : 0;
  $('h').style.transform = `scale(${1 + 0.05 * Math.sin(cl(t / 0.3) * Math.PI)})`;
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
