<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="mascotte.js"></script>
<script src="common.js"></script>
<style>
  /* SEGUI IL GELO: il gioco dei tre bicchieri. Gelo finisce sotto un bicchiere, i bicchieri si scambiano sempre più veloci */
  #hook { position: absolute; top: 196px; left: 70px; right: 70px; font-family: var(--f-titolo); font-weight: 700; font-size: 92px; line-height: 1.04; letter-spacing: -2.5px; text-wrap: balance; transform-origin: 0% 50%; z-index: 4; }
  #info { position: absolute; top: 470px; left: 70px; font-family: var(--f-logo); font-size: 30px; padding: 14px 22px 6px; border-radius: 16px; background: var(--inchiostro); color: #fff; z-index: 5; transform: rotate(-2deg); }
  #big { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-family: var(--f-logo); font-size: 250px; line-height: 1.2; color: var(--limone); -webkit-text-stroke: 12px var(--inchiostro); paint-order: stroke fill; z-index: 6; display: none; }
  .theme-limone #big { color: var(--ghiacciolo); }
  #slab { position: absolute; left: 40px; right: 40px; top: 1290px; height: 120px; background: var(--brina); border: 7px solid var(--inchiostro); border-radius: 40px; box-shadow: 14px 14px 0 var(--inchiostro); z-index: 2; }
  #slab::after { content: ''; position: absolute; left: 40px; right: 40px; top: 22px; height: 12px; border-radius: 6px; background: #fff; }
  .cup { position: absolute; left: 0; top: 0; width: 280px; height: 330px; margin-left: -140px; z-index: 5; transform-origin: 50% 100%; }
  .sh { position: absolute; left: 0; top: 1296px; width: 250px; height: 34px; margin-left: -125px; border-radius: 50%; background: rgba(10,15,61,0.28); z-index: 3; }
  #gelo { position: absolute; left: 0; top: 1096px; margin-left: -105px; z-index: 4; transform-origin: 50% 100%; }
  .num { position: absolute; top: 1440px; width: 110px; height: 110px; margin-left: -55px; border-radius: 30px; background: var(--inchiostro); color: #fff; display: grid; place-items: center; font-family: var(--f-logo); font-size: 56px; padding-top: 10px; z-index: 5; border: 6px solid var(--inchiostro); }
  .num.ok { background: var(--menta); color: var(--inchiostro); }
  #arrow { position: absolute; left: 0; top: 700px; margin-left: -150px; width: 300px; text-align: center; font-family: var(--f-logo); font-size: 40px; background: var(--limone); color: var(--inchiostro); border: 6px solid var(--inchiostro); border-radius: 22px; padding: 18px 10px 8px; box-shadow: 0 9px 0 var(--inchiostro); z-index: 7; }
  #arrow::after { content: ''; position: absolute; left: 50%; bottom: -34px; margin-left: -22px; border: 22px solid transparent; border-top: 30px solid var(--inchiostro); border-bottom: 0; }
</style>
</head>
<body>
  <div id="hook"></div>
  <div id="info"></div>
  <div id="big"></div>
  <div id="arrow">GELO È QUI</div>
  <div id="slab"></div>
  <div id="shs"></div>
  <div id="gelo"></div>
  <div id="cups"></div>
  <div id="nums"></div>
<script>
let R, SW = [], ENDS = 0, T_DOWN = 1.15, T_ASK = 0, T_REV = 0, WIN = 1, lastE = '';
const X = [220, 540, 860], BASE = 1316, ASK = 3.0;
const CUP = `<svg viewBox="0 0 280 330" width="280" height="330">
  <path d="M74 22 H206 Q222 22 226 38 L264 290 Q268 314 244 314 H36 Q12 314 16 290 L54 38 Q58 22 74 22 Z" fill="var(--ghiacciolo)" stroke="#0A0F3D" stroke-width="10" stroke-linejoin="round"/>
  <path d="M42 150 H238 L248 214 H32 Z" fill="var(--limone)" stroke="#0A0F3D" stroke-width="8" stroke-linejoin="round"/>
  <path d="M82 48 L70 124" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".7"/>
  <rect x="8" y="286" width="264" height="36" rx="18" fill="#EAF6FF" stroke="#0A0F3D" stroke-width="10"/></svg>`;

function setup(reel, handle) {
  R = reel; baseLayer(reel.tag || 'SEGUI IL GELO', handle, reel.fine);
  $('hook').innerHTML = hlWords(reel.hook);
  $('cups').innerHTML = [0, 1, 2].map(() => `<div class="cup">${CUP}</div>`).join('');
  $('shs').innerHTML = [0, 1, 2].map(() => '<div class="sh"></div>').join('');
  $('nums').innerHTML = [0, 1, 2].map(k => `<div class="num" style="left:${X[k]}px">${k + 1}</div>`).join('');
  const r = rng((reel.seme || 1) * 31 + 7), n = reel.scambi || 12, d0 = reel.lento || 0.56, d1 = reel.veloce || 0.25;
  let t = T_DOWN + 0.25, prev = -1; const sounds = [{ t: 0.02, k: 'slam' }, { t: T_DOWN - 0.08, k: 'pop' }];
  let slot = [0, 1, 2]; // slot[c] = posizione del bicchiere c
  for (let k = 0; k < n; k++) {
    let pair; do { pair = Math.floor(r() * 3); } while (pair === prev); prev = pair;
    const [a, b] = [[0, 1], [1, 2], [0, 2]][pair];
    const d = d0 * Math.pow(d1 / d0, k / (n - 1)) * (pair === 2 ? 1.18 : 1);
    const ca = slot.indexOf(a), cb = slot.indexOf(b);
    SW.push({ t0: t, d, ca, cb, a, b, up: r() < 0.5 });
    slot[ca] = b; slot[cb] = a;
    sounds.push({ t: t + d * 0.15, k: 'whoosh' });
    t += d + 0.03;
  }
  WIN = slot[1]; // Gelo parte sotto il bicchiere centrale (bicchiere 1)
  T_ASK = t + 0.2; T_REV = T_ASK + ASK;
  sounds.push({ t: T_ASK, k: 'ding' });
  for (let s = 0; s < ASK; s++) sounds.push({ t: T_ASK + s, k: 'tick' });
  sounds.push({ t: T_REV, k: 'pop' }, { t: T_REV + 0.2, k: 'pop' }, { t: T_REV + 0.75, k: 'ice' });
  ENDS = T_REV + 2.5; sounds.push({ t: ENDS, k: 'slam' });
  return { duration: ENDS + END_LEN, sounds };
}

function cupState(c, t) { // posizione del bicchiere c al tempo t
  let s = c, x, dy = 0, sc = 1, z = 5;
  for (const w of SW) {
    if (w.ca !== c && w.cb !== c) continue;
    const from = w.ca === c ? w.a : w.b, to = w.ca === c ? w.b : w.a;
    if (t >= w.t0 + w.d) { s = to; continue; }
    if (t >= w.t0) {
      const p = easeIO((t - w.t0) / w.d), arc = Math.sin(p * Math.PI), front = (w.ca === c) === w.up;
      x = X[from] + (X[to] - X[from]) * p; dy = front ? arc * 64 : -arc * 80; sc = front ? 1 + arc * 0.1 : 1 - arc * 0.1; z = front ? 7 : 4;
      return { x, dy, sc, z, tilt: (X[to] - X[from]) / 320 * arc * 9 };
    }
    break;
  }
  return { x: X[s], dy: 0, sc: 1, z: 5, tilt: 0 };
}

function setTime(t) {
  bgTick(t);
  if (endCard(t, ENDS)) return;
  $('hook').style.transform = `scale(${1 + 0.06 * Math.sin(cl(t / 0.3) * Math.PI)})`;
  const cups = $('cups').children, shs = $('shs').children, nums = $('nums').children;
  const asking = t >= T_ASK && t < T_REV, rev = t >= T_REV, pr = t - T_REV;
  for (let c = 0; c < 3; c++) {
    const st = cupState(c, t); let lift = 0, tilt = st.tilt;
    if (c === 1 && t < T_DOWN) { lift = 360 * (1 - easeIO((t - 0.62) / (T_DOWN - 0.62))); tilt = -8 * (lift / 360); }
    if (asking) tilt = Math.sin(t * 22 + c * 2) * 2.2;
    if (rev) { const isWin = cupState(c, t).x === X[WIN]; const p = back((pr - (isWin ? 0.7 : c * 0.1)) / 0.38); lift = 380 * p; tilt = (isWin ? -10 : 8) * p; }
    cups[c].style.transform = `translate(${st.x}px, ${BASE - 330 + st.dy - lift}px) rotate(${tilt}deg) scale(${st.sc})`;
    cups[c].style.zIndex = st.z;
    shs[c].style.transform = `translateX(${st.x}px) scale(${1 - Math.min(1, lift / 500) * 0.45 - Math.max(0, -st.dy) / 400})`;
    shs[c].style.opacity = 1 - Math.min(1, lift / 500) * 0.6;
  }
  // Gelo: visibile all'inizio e alla fine
  const g = $('gelo'), showG = t < T_DOWN || rev;
  g.style.display = showG ? 'block' : 'none';
  const expr = rev && pr > 0.75 ? 'ride' : t < T_DOWN ? 'sveglio' : 'furbo';
  if (lastE !== expr) { g.innerHTML = gelo(expr, 210); lastE = expr; }
  const gx = rev ? X[WIN] : X[1];
  const hop = rev && pr > 0.75 ? Math.abs(Math.sin((pr - 0.75) * 9)) * 60 * Math.max(0, 1 - (pr - 0.75) / 1.6) : 0;
  const squash = t < T_DOWN ? 1 - 0.12 * cl((t - 0.9) / 0.2) : 1;
  g.style.transform = `translate(${gx}px, ${-hop}px) rotate(${t < T_DOWN ? Math.sin(t * 9) * 7 : Math.sin(t * 8) * 6}deg) scale(1, ${squash})`;
  // etichette
  const ar = $('arrow'); ar.style.display = 'none'; ar.style.transform = `translate(${X[1]}px, ${Math.sin(t * 10) * 12}px) rotate(-3deg)`;
  const k = SW.findIndex(w => t < w.t0 + w.d), sp = k < 0 ? SW.length - 1 : k;
  const inf = $('info');
  inf.textContent = rev ? (pr > 0.75 ? `ERA IL NUMERO ${WIN + 1}` : 'VEDIAMO...') : asking ? 'SCRIVI 1, 2 O 3' : t < T_DOWN ? 'GELO È QUI, GUARDA BENE' : `VELOCITÀ ×${(SW[0].d / SW[sp].d).toFixed(1)}`;
  inf.style.background = rev && pr > 0.75 ? 'var(--menta)' : 'var(--inchiostro)'; inf.style.color = rev && pr > 0.75 ? 'var(--inchiostro)' : '#fff';
  const big = $('big'); big.style.display = asking ? 'block' : 'none';
  if (asking) { const q = (t - T_ASK) % 1; big.textContent = Math.max(1, Math.ceil(ASK - (t - T_ASK))); big.style.transform = `scale(${1.5 - 0.5 * back(q / 0.3)})`; big.style.opacity = cl(q * 8) * (1 - cl((q - 0.8) / 0.2)); }
  for (let n = 0; n < 3; n++) {
    const on = t >= T_ASK; nums[n].style.display = on ? 'grid' : 'none';
    const isWin = rev && pr > 0.75 && n === WIN;
    nums[n].className = 'num' + (isWin ? ' ok' : '');
    nums[n].style.transform = `scale(${back((t - T_ASK - n * 0.08) / 0.3) * (isWin ? 1.25 + 0.06 * Math.sin(t * 12) : 1)}) rotate(${(n - 1) * 3}deg)`;
    nums[n].style.opacity = rev && pr > 0.75 && n !== WIN ? 0.35 : 1;
  }
  const shake = freeze(rev && pr >= 0.75 ? pr - 0.75 : null, [600, 620]);
  $('cups').style.marginLeft = shake + 'px';
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
