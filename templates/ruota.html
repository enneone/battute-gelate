<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<script src="mascotte.js"></script>
<script src="common.js"></script>
<style>
  /* RUOTA DELLA FREDDURA: la ruota sceglie il mestiere, arriva il colmo */
  #hook { position: absolute; top: 200px; left: 70px; right: 70px; font-family: var(--f-titolo); font-weight: 700; font-size: 80px; line-height: 1.02; letter-spacing: -2px; text-wrap: balance; z-index: 4; transform-origin: 0% 50%; }
  #wheelBox { position: absolute; left: 90px; top: 620px; width: 900px; height: 900px; }
  #wheel { width: 900px; height: 900px; }
  #pin { position: absolute; left: 50%; top: -40px; margin-left: -50px; width: 100px; height: 120px; z-index: 3; }
  #hub { position: absolute; left: 50%; top: 50%; width: 220px; height: 220px; margin: -110px 0 0 -110px; z-index: 2; display: grid; place-items: center; }
  #card { position: absolute; left: 60px; right: 60px; top: 640px; height: 820px; background: var(--brina); color: var(--inchiostro); z-index: 8;
    border-radius: var(--r-card); border: 7px solid var(--inchiostro); box-shadow: 18px 18px 0 var(--inchiostro); overflow: hidden; }
  #who { position: absolute; top: 44px; left: 48px; font-family: var(--f-logo); font-size: 64px; padding: 14px 28px 4px; border-radius: 20px; border: 6px solid var(--inchiostro); line-height: 1.25; }
  #q { position: absolute; top: 210px; left: 48px; right: 48px; font-family: var(--f-titolo); font-weight: 700; font-size: 76px; line-height: 1.05; letter-spacing: -1.5px; text-wrap: balance; }
  #a { position: absolute; left: 36px; right: 36px; top: 450px; min-height: 260px; background: var(--punch); color: var(--punchfg); border: 7px solid var(--inchiostro); border-radius: 40px;
    display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--f-titolo); font-weight: 700; font-size: 80px; line-height: 1.02; letter-spacing: -1.5px; padding: 30px 40px; text-wrap: balance; }
  #cm { position: absolute; right: 30px; top: 540px; z-index: 9; }
  #spinN { position: absolute; right: 70px; top: 140px; font-family: var(--f-mono); font-size: 28px; letter-spacing: 2px; z-index: 15; }
</style>
</head>
<body>
  <div id="hook"></div>
  <div id="spinN"></div>
  <div id="wheelBox">
    <svg id="pin" viewBox="0 0 100 120"><path d="M8 8 H92 L50 112 Z" fill="var(--limone)" stroke="var(--inchiostro)" stroke-width="8" stroke-linejoin="round"/></svg>
    <svg id="wheel" viewBox="-460 -460 920 920"></svg>
    <div id="hub"></div>
  </div>
  <div id="card"><div id="who"></div><div id="q"></div><div id="a"></div></div>
  <div id="cm"></div>
<script>
let R, S = [], INTRO = 1.3, ENDS = 0, SEG = [], lastE = '';
const COLS = ['var(--ghiacciolo)', 'var(--limone)', 'var(--brina)', 'var(--menta)'];
const INK = ['#fff', 'var(--inchiostro)', 'var(--inchiostro)', 'var(--inchiostro)'];
const SPIN = 2.6;

function setup(reel, handle) {
  R = reel; baseLayer('RUOTA DELLA FREDDURA', handle, reel.fine);
  $('hook').innerHTML = hlWords(reel.hook);
  SEG = reel.spicchi; const n = SEG.length, a = 360 / n;
  let svg = '';
  SEG.forEach((s, k) => {
    const a0 = (k * a - 90 - a / 2) * Math.PI / 180, a1 = ((k + 1) * a - 90 - a / 2) * Math.PI / 180, r = 440;
    svg += `<path d="M0 0 L${r * Math.cos(a0)} ${r * Math.sin(a0)} A${r} ${r} 0 0 1 ${r * Math.cos(a1)} ${r * Math.sin(a1)} Z" fill="${COLS[k % 4]}" stroke="#0A0F3D" stroke-width="8"/>`;
    svg += `<g transform="rotate(${k * a})"><text x="0" y="-250" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 0 -250)" font-family="Boldonse" font-size="34" fill="${INK[k % 4]}">${s.toUpperCase()}</text></g>`;
  });
  svg += `<circle r="448" fill="none" stroke="#0A0F3D" stroke-width="14"/>`;
  for (let k = 0; k < n; k++) { const an = (k * a - 90 - a / 2) * Math.PI / 180; svg += `<circle cx="${430 * Math.cos(an)}" cy="${430 * Math.sin(an)}" r="10" fill="#fff" stroke="#0A0F3D" stroke-width="4"/>`; }
  $('wheel').innerHTML = svg;
  $('hub').innerHTML = gelo('furbo', 220);
  let t = INTRO, rot = 0; const sounds = [{ t: 0.02, k: 'slam' }];
  reel.battute.forEach((b, i) => {
    const target = SEG.indexOf(b[0]);
    const startRot = rot, endRot = Math.ceil(startRot / 360) * 360 + 360 * 3 - target * a; // il mestiere si ferma sotto la lancetta
    const start = t, land = start + SPIN, cardIn = land + 0.55, reveal = cardIn + Math.min(2.4, 1.4 + b[1].length * 0.02), end = reveal + 2.0;
    S.push({ i, who: b[0], q: b[1], ans: b[2], startRot, endRot, start, land, cardIn, reveal, end });
    // un "tic" ogni spicchio che passa sotto la lancetta
    const passes = Math.floor((endRot - startRot) / a);
    for (let k = 1; k <= passes; k++) {
      const target = startRot + k * a; let lo = 0, hi = 1;
      for (let it = 0; it < 20; it++) { const mid = (lo + hi) / 2; if (startRot + (endRot - startRot) * spinEase(mid) < target) lo = mid; else hi = mid; }
      sounds.push({ t: start + lo * SPIN, k: 'click' });
    }
    sounds.push({ t: land, k: 'ding' }, { t: cardIn, k: 'whoosh' }, { t: reveal, k: 'ice' });
    rot = endRot; t = end;
  });
  ENDS = t; sounds.push({ t: ENDS, k: 'slam' });
  return { duration: ENDS + 2.5, sounds };
}
function spinEase(x) { x = cl(x); return 1 - Math.pow(1 - x, 4); }

function setTime(t) {
  bgTick(t);
  if (endCard(t, ENDS)) return;
  $('hook').style.transform = `scale(${1 + 0.07 * Math.sin(cl(t / 0.3) * Math.PI)})`;
  const e = S.find(x => t >= x.start && t < x.end) || (t < INTRO ? S[0] : S[S.length - 1]);
  $('spinN').textContent = t >= INTRO ? `GIRO ${pad2(e.i + 1)}/${pad2(S.length)}` : '';
  // ruota
  let r = e.startRot;
  if (t >= e.start) r = e.startRot + (e.endRot - e.startRot) * spinEase((t - e.start) / SPIN);
  const wob = t >= e.land && t < e.land + 0.4 ? Math.sin((t - e.land) * 30) * 3 * (1 - (t - e.land) / 0.4) : 0;
  $('wheel').style.transform = `rotate(${r + wob}deg)`;
  const wIn = 0;
  $('wheelBox').style.transform = `translateY(${wIn * 1300}px)`;
  $('pin').style.transform = `rotate(${t >= e.start && t < e.land ? Math.sin(t * 40) * 10 * (1 - (t - e.start) / SPIN) : 0}deg)`;
  // card
  const card = $('card');
  const cin = ease((t - e.cardIn) / 0.35), cout = ease((t - (e.end - 0.3)) / 0.3);
  const vis = t >= e.cardIn && t < e.end;
  card.style.display = vis ? 'block' : 'none';
  const revealed = t >= e.reveal, pr = t - e.reveal;
  const shake = freeze(revealed && vis ? pr : null, [70, 560]);
  card.style.transform = `translate(${shake}px, ${(1 - cin) * 1300 + cout * 1300}px) rotate(-1.2deg)`;
  const k = SEG.indexOf(e.who);
  $('who').textContent = e.who.toUpperCase(); $('who').style.background = COLS[k % 4]; $('who').style.color = INK[k % 4];
  $('q').textContent = e.q; $('a').textContent = e.ans;
  $('a').style.display = revealed ? 'flex' : 'none';
  $('a').style.transform = `rotate(-2deg) scale(${0.3 + 0.7 * back(pr / 0.32)})`;
  // mascotte: al centro della ruota, poi sulla card
  const cm = $('cm'); const expr = revealed ? 'gelato' : 'furbo';
  if (vis) { if (lastE !== expr) { cm.innerHTML = gelo(expr, 230); lastE = expr; } cm.style.display = 'block';
    cm.style.transform = `translateY(${(1 - cin) * 1300 + cout * 1300}px) rotate(${revealed ? Math.sin(t * 60) * 6 : 8}deg)`; }
  else cm.style.display = 'none';
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
