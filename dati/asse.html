<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="base.js"></script>
<style>
  /* ASSE: ogni paese è un punto su una scala (es. età). I punti scivolano al loro valore, poi linea della media e distacco. */
  #cv { position: absolute; left: 0; top: 0; z-index: 5; }
  #msg { position: absolute; left: 70px; right: 70px; top: 1620px; z-index: 22; font-family: "Outfit"; font-weight: 700; font-size: 46px; line-height: 1.12; opacity: 0; }
  #msg .ser { font-size: 58px; }
</style>
</head>
<body>
  <canvas id="cv" width="1080" height="1920"></canvas>
<script>
let R, ENDS = 0, T = {}, IT = [];
const X0 = 330, X1 = 990, TOP = 690, ROWH = 64;
const sx = (v) => X0 + (v - R.min) / (R.max - R.min) * (X1 - X0);

function setup(reel, handle) {
  R = reel; base(reel, handle); hookBlock(reel);
  IT = reel.voci.slice().sort((a, b) => a.v - b.v);
  T.start = 0.6; T.step = 0.3; T.avg = Math.max(T.start + IT.length * T.step + 0.4, 4.7); T.gap = T.avg + 1.9; T.msg = T.gap; T.q = T.gap + 2.6;
  T.f4 = T.gap + 2.3; if ((reel.frasi || []).length > 3) T.q = T.f4 + 2.4;
  ENDS = T.q + 2.6;
  setFrasi([2.6, T.avg, T.gap, T.f4]);
  const s = [{ t: 0.02, k: 'hit' }];
  IT.forEach((it, i) => s.push({ t: T.start + i * T.step + 0.25, k: it.focus ? 'hit' : 'n' + Math.min(7, Math.floor(i * 8 / IT.length)) }));
  s.push({ t: T.avg, k: 'whoosh' }, { t: T.gap, k: 'ding' }, { t: T.q, k: 'whoosh' }, { t: ENDS, k: 'whoosh' });
  
  return { duration: ENDS + END_LEN, sounds: s };
}

const cv = $('cv'), cx = cv.getContext('2d');
function setTime(t) {
  if (endCard(t, ENDS)) return;
  cx.clearRect(0, 0, 1080, 1920);
  hookAnim(t, T.q);
  const H = IT.length * ROWH, y0 = TOP;
  // scala in alto con le tacche
  cx.font = '24px Geist'; cx.textAlign = 'center'; cx.fillStyle = '#8B8B99';
  for (let v = R.min; v <= R.max; v += R.passo) {
    const x = sx(v), a = cl((t - 0.1) * 3);
    cx.globalAlpha = a; cx.fillText(v + (R.unita_breve || ''), x, y0 - 22);
    cx.strokeStyle = 'rgba(255,255,255,.07)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(x, y0 - 6); cx.lineTo(x, y0 + H); cx.stroke();
  }
  cx.globalAlpha = 1;
  // righe
  IT.forEach((it, i) => {
    const y = y0 + i * ROWH + ROWH / 2, st = T.start + i * T.step, p = (t - st) / 0.55;
    if (p <= 0) return;
    const a = cl(p * 3), x = lerp(X0, sx(it.v), easeIO(p));
    const col = it.focus ? '#FF5B4A' : (it.top ? '#C8FF2E' : '#F4F4F6');
    cx.globalAlpha = a;
    // bandiera e nome
    cx.textAlign = 'left'; cx.font = '42px "Noto Color Emoji"'; cx.fillText(it.f, 70, y + 15);
    cx.font = `700 ${it.focus ? 40 : 36}px Shoulders`; cx.fillStyle = it.focus ? '#FF5B4A' : '#F4F4F6'; cx.fillText(it.n.toUpperCase(), 132, y + 13);
    // binario
    cx.strokeStyle = 'rgba(255,255,255,.12)'; cx.lineWidth = 4; cx.lineCap = 'round'; cx.beginPath(); cx.moveTo(X0, y); cx.lineTo(x, y); cx.stroke();
    // punto
    cx.save(); cx.shadowColor = col; cx.shadowBlur = it.focus ? 40 : 18; cx.fillStyle = col;
    cx.beginPath(); cx.arc(x, y, it.focus ? 20 : 15, 0, 6.2832); cx.fill(); cx.restore();
    // valore
    cx.font = `700 ${it.focus ? 32 : 26}px Geist`; cx.fillStyle = col; cx.textAlign = x > X1 - 120 ? 'right' : 'left';
    cx.fillText(fmt(lerp(R.min, it.v, easeIO(p)), 1), x > X1 - 120 ? x - 30 : x + 28, y + 10);
    cx.globalAlpha = 1;
  });
  // linea della media
  if (R.media) {
    const p = (t - T.avg) / 0.6; if (p > 0) {
      const x = sx(R.media.v), h = H * easeIO(p);
      cx.save(); cx.setLineDash([10, 10]); cx.strokeStyle = '#C8FF2E'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(x, y0); cx.lineTo(x, y0 + h); cx.stroke(); cx.restore();
      cx.globalAlpha = cl(p * 2); cx.fillStyle = '#C8FF2E'; cx.font = '700 26px Geist'; cx.textAlign = 'center';
      cx.fillText(`${R.media.label} ${fmt(R.media.v, 1)}`, x, y0 + H + 46); cx.globalAlpha = 1;
    }
  }
  // distacco tra il primo e il focus
  const gp = (t - T.gap) / 0.6;
  if (gp > 0) {
    const a = IT[0], b = IT.find(x => x.focus), ya = y0 + H + 100;
    const xa = sx(a.v), xb = lerp(xa, sx(b.v), easeIO(gp));
    cx.strokeStyle = '#FF5B4A'; cx.lineWidth = 6; cx.lineCap = 'round';
    cx.beginPath(); cx.moveTo(xa, ya); cx.lineTo(xb, ya); cx.stroke();
    cx.beginPath(); cx.moveTo(xa, ya - 16); cx.lineTo(xa, ya + 16); cx.moveTo(xb, ya - 16); cx.lineTo(xb, ya + 16); cx.stroke();
    cx.globalAlpha = cl(gp * 2); cx.font = '700 44px Geist'; cx.fillStyle = '#FF5B4A'; cx.textAlign = 'center';
    cx.textAlign = 'right'; cx.fillText(`+${fmt(b.v - a.v, 1)} ${R.unita || ''}`, xa - 24, ya + 16); cx.globalAlpha = 1;
  }
  
  domanda(t, T.q, R);
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
