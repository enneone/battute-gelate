<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
/* CHE NUMERI: proposte di scritta moderna per la foto profilo. ?l=1..4 */
@font-face { font-family: "Brico"; src: url("fonts/BricolageGrotesque-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Boldonse"; src: url("fonts/Boldonse-Regular.ttf"); }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body { position: relative; display: grid; place-items: center; background: #FF4A1C; }
.bg { position: absolute; inset: 0; background: radial-gradient(circle at 28% 20%, #FF7A4D 0%, #FF4A1C 48%, #EC3A10 100%); }
.grain { position: absolute; inset: 0; opacity: .09; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.l { position: relative; display: none; color: #121212; }
.l b { color: #FFF4EA; font-weight: inherit; }
/* 1: Bricolage minuscolo, impilato */
.m1 { font-family: "Brico"; font-weight: 700; font-size: 250px; line-height: .78; letter-spacing: -14px; margin-left: -20px; }
.m1 .r2 { margin-left: 0; }
/* 2: Boldonse largo */
.m2 { font-family: "Boldonse"; font-size: 118px; line-height: 1.12; text-align: center; letter-spacing: -2px; }
/* 3: Inter Display Black, pulito da startup */
.m3 { font-family: "Inter Display"; font-weight: 900; font-size: 196px; line-height: .86; letter-spacing: -11px; }
.m3 .dot { display: inline-block; width: 46px; height: 46px; border-radius: 50%; background: #FFF4EA; margin-left: 10px; }
/* 4: adesivo */
.m4 { transform: rotate(-7deg); }
.m4 .st { background: #FFF4EA; border-radius: 64px; padding: 46px 56px 54px; box-shadow: 0 26px 0 #121212; border: 8px solid #121212; }
.m4 .t { font-family: "Brico"; font-weight: 700; font-size: 168px; line-height: .8; letter-spacing: -9px; color: #121212; }
.m4 .t b { color: #FF4A1C; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="l m1"><div>che</div><div class="r2">numeri<b>!</b></div></div>
<div class="l m2">CHE<br>NUMERI<b>!</b></div>
<div class="l m3">che<br>numeri<span class="dot"></span></div>
<div class="l m4"><div class="st"><div class="t">che<br>numeri<b>!</b></div></div></div>
<div class="grain"></div>
<script>
const l = new URLSearchParams(location.search).get('l') || '1';
document.querySelector('.m' + l).style.display = 'block';
</script>
</body>
</html>
