<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="base.js"></script>
<style>
  /* Copertina del Reel: tutto il testo nella zona 3:4 visibile nella griglia del profilo (y 240-1680) */
  #ck { position: absolute; left: 80px; right: 80px; top: 380px; font-family: "Geist"; font-weight: 700; font-size: 30px; letter-spacing: 5px; color: #C8FF2E; z-index: 20; }
  #ct { position: absolute; left: 76px; right: 76px; top: 450px; font-family: "Shoulders"; font-weight: 700; font-size: 170px; line-height: .88; text-transform: uppercase; z-index: 20; }
  #ct .ser { font-size: 190px; }
  #cn { position: absolute; left: 80px; top: 1440px; font-family: "Geist"; font-weight: 700; font-size: 120px; color: #C8FF2E; letter-spacing: -4px; z-index: 20; }
  #cm { position: absolute; right: 80px; top: 1460px; z-index: 20; }
  .brand, .src { display: none !important; }
  body.vice { background: linear-gradient(180deg, #0B0614 0%, #2A0838 55%, #5A0F44 100%); }
  body.vice #ck { color: #FFB36B; } body.vice #cn { color: #FFB36B; } body.vice #ct .ser { color: #FF6FB0; }
  #big0 { position: absolute; right: -120px; bottom: 120px; font-family: "Shoulders"; font-weight: 700; font-size: 900px; line-height: .8; color: rgba(255,255,255,.035); z-index: 1; }
</style>
</head>
<body>
  <div id="big0"></div><div id="ck"></div><div id="ct"></div><div id="cn"></div>
  <svg id="cm" width="130" height="130" viewBox="0 0 1080 1080"><rect width="1080" height="1080" rx="240" fill="#C8FF2E"/>
    <g transform="translate(70 0)"><g transform="translate(470 610)"><circle r="196" fill="none" stroke="#0B0B10" stroke-width="132"/><circle r="196" fill="none" stroke="#FF5B4A" stroke-width="132" stroke-dasharray="308 1232" transform="rotate(200)"/></g>
    <path d="M600 218 a8 8 0 0 1 8 -8 h116 a8 8 0 0 1 8 8 v654 h-132 z" fill="#0B0B10"/></g></svg>
<script>
function setup(reel, handle) {
  base(reel, handle); if (reel.copertina_tema) document.body.classList.add(reel.copertina_tema);
  $('ck').textContent = reel.copertina_kicker || reel.kicker || '';
  $('ct').innerHTML = (reel.copertina || reel.hook).map(hl).join('<br>');
  if (reel.copertina_size) $('ct').style.fontSize = reel.copertina_size + 'px';
  $('cn').textContent = reel.copertina_numero || '';
  $('big0').textContent = 'N.' + String(reel.numero || 1).padStart(2, '0');
  return { duration: 0, sounds: [] };
}
window.setup = setup; window.setTime = () => {};
</script>
</body>
</html>
