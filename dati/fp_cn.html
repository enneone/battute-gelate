<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
/* CHE NUMERI: foto profilo. Scritta "che numeri!" in Bricolage Grotesque, minuscola, col punto esclamativo chiaro. ?t=arancio|carta|nero */
@font-face { font-family: "Brico"; src: url("fonts/BricolageGrotesque-Bold.ttf"); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body { position: relative; display: grid; place-items: center; }
.bg { position: absolute; inset: 0; }
.arancio .bg { background: radial-gradient(circle at 28% 20%, #FF7A4D 0%, #FF4A1C 48%, #EC3A10 100%); }
.carta .bg { background: radial-gradient(circle at 28% 20%, #FFFFFF 0%, #F2EFE8 50%, #E4DFD3 100%); }
.nero .bg { background: radial-gradient(circle at 28% 20%, #2A2A2A 0%, #151515 50%, #0A0A0A 100%); }
.grain { position: absolute; inset: 0; opacity: .09; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.w { position: relative; font-family: "Brico"; font-weight: 700; font-size: 258px; line-height: .8; letter-spacing: -14px; color: #121212; padding-bottom: 30px; }
.w b { font-weight: inherit; color: #FFF4EA; }
.carta .w b, .nero .w b { color: #FF4A1C; } .nero .w { color: #F2EFE8; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="w"><div>che</div><div>numeri<b>!</b></div></div>
<div class="grain"></div>
<script>document.body.className = new URLSearchParams(location.search).get('t') || 'arancio';</script>
</body>
</html>
