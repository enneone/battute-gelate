<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<script src="base.js"></script>
<style>
  /* BARRE: classifica completa a barre orizzontali, svelata dal fondo verso l'alto, con primi e ultimo evidenziati */
  #tab { position: absolute; left: 70px; right: 70px; top: 640px; z-index: 10; }
  .rw { position: absolute; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 14px; }
  .rw .p { width: 46px; font-family: "Geist"; font-weight: 700; font-size: 22px; color: #8B8B99; text-align: right; }
  .rw .n { width: 190px; font-family: "Shoulders"; font-weight: 700; font-size: 34px; text-transform: uppercase; white-space: nowrap; }
  .rw .bw { flex: 1; height: 30px; position: relative; }
  .rw .b { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 8px; background: linear-gradient(90deg, #2C2C36, #4A4A58); transform-origin: 0 50%; }
  .rw .v { position: absolute; top: 50%; transform: translateY(-50%); font-family: "Geist"; font-weight: 700; font-size: 22px; white-space: nowrap; padding-left: 12px; }
  .rw.top .b { background: linear-gradient(90deg, #8FBF10, #C8FF2E); box-shadow: 0 0 30px rgba(200,255,46,.35); }
  .rw.top .n, .rw.top .v, .rw.top .p { color: #C8FF2E; }
  .rw.low .b { background: linear-gradient(90deg, #A8301F, #FF5B4A); box-shadow: 0 0 30px rgba(255,91,74,.35); }
  .rw.low .n, .rw.low .v, .rw.low .p { color: #FF5B4A; }
  #cl { position: absolute; left: 70px; right: 70px; top: 1600px; z-index: 22; font-family: "Outfit"; font-weight: 700; font-size: 44px; line-height: 1.15; opacity: 0; }
  #cl .ser { font-size: 54px; }
</style>
</head>
<body>
  <div id="tab"></div>
<script>
let R, ENDS = 0, T = {}, IT = [];
const ROWH = 46;

function setup(reel, handle) {
  R = reel; base(reel, handle); hookBlock(reel);
  IT = reel.voci.slice().sort((a, b) => b.v - a.v);
  const max = IT[0].v, n = IT.length;
  $('tab').innerHTML = IT.map((it, i) => `<div class="rw${i < (reel.evidenzia_top || 1) ? ' top' : ''}${i === n - 1 ? ' low' : ''}" style="top:${i * ROWH}px">
    <div class="p">${i + 1}</div><div class="n">${it.n}</div><div class="bw"><div class="b" style="width:${it.v / max * 76}%"></div>
    <div class="v" style="left:${it.v / max * 76}%">${fmt(it.v, 1)}${reel.suffisso || ''}</div></div></div>`).join('');
  T.start = 0.6; T.step = 0.2; T.end = T.start + n * T.step + 0.5; T.cl = T.end + 1.8; T.q = T.cl + 2.6; ENDS = T.q + 2.6;
  setFrasi([2.6, T.end, T.cl]);
  const s = [{ t: 0.02, k: 'hit' }];
  for (let i = 0; i < n; i++) s.push({ t: T.start + i * T.step, k: i === n - 1 ? 'hit' : (i % 2 ? 'tick' : 'pop') });
  s.push({ t: T.cl, k: 'ding' }, { t: T.q, k: 'whoosh' }, { t: ENDS, k: 'whoosh' });
  return { duration: ENDS + END_LEN, sounds: s };
}

function setTime(t) {
  if (endCard(t, ENDS)) return;
  hookAnim(t, T.q);
  const els = $('tab').children, n = IT.length;
  for (let i = 0; i < n; i++) {
    const order = n - 1 - i, p = (t - T.start - order * T.step) / 0.5, el = els[i];
    el.style.opacity = cl(p * 3); el.style.transform = `translateX(${(1 - ease(p)) * -60}px)`;
    el.querySelector('.b').style.transform = `scaleX(${easeIO(p)})`;
    const v = el.querySelector('.v'); v.style.opacity = cl((p - 0.6) * 4);
    if (i === 0) el.style.transform += ` scale(${1 + 0.05 * Math.sin(cl(p) * Math.PI)})`;
  }
  domanda(t, T.q, R);
}
window.setup = setup; window.setTime = setTime;
</script>
</body>
</html>
