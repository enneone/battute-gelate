<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
/* CHE NUMERI: proposte di logo per la foto profilo. ?l=A|B|C|D sceglie la proposta, ?t= il colore */
@font-face { font-family: "Shoulders"; src: url("fonts/BigShoulders-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Serif"; src: url("fonts/InstrumentSerif-Italic.ttf"); font-style: italic; }
@font-face { font-family: "Outfit"; src: url("fonts/Outfit-Bold.ttf"); font-weight: 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1080px; overflow: hidden; }
body { position: relative; display: grid; place-items: center; }
.bg { position: absolute; inset: 0; background: radial-gradient(circle at 30% 22%, #FF7347 0%, #FF4A1C 45%, #E8360E 100%); }
.carta .bg { background: radial-gradient(circle at 30% 22%, #FFFFFF 0%, #F2EFE8 50%, #E4DFD3 100%); }
.nero .bg { background: radial-gradient(circle at 30% 22%, #2A2A2A 0%, #151515 50%, #0A0A0A 100%); }
.grain { position: absolute; inset: 0; opacity: .10; mix-blend-mode: multiply; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='4'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
.l { position: relative; display: none; filter: drop-shadow(0 22px 26px rgba(0,0,0,.25)); }
/* A: tipografico */
.A { text-align: center; font-family: "Shoulders"; font-weight: 700; color: #121212; line-height: .86; text-transform: uppercase; transform: rotate(-6deg); }
.A .a1 { font-size: 186px; letter-spacing: 10px; margin-bottom: 14px; }
.A .a2 { font-size: 268px; letter-spacing: -3px; white-space: nowrap; }
.A .a2 b { color: #FFF4EA; }
/* B: fumetto */
.B svg { width: 760px; height: 760px; display: block; }
/* C: faccina percento */
.C svg { width: 780px; height: 780px; display: block; }
/* D: monogramma */
.D { font-family: "Shoulders"; font-weight: 700; color: #121212; font-size: 720px; line-height: .8; letter-spacing: -30px; align-items: center; }
.D b { color: #FFF4EA; font-size: 720px; margin-left: -10px; }
.nero .A, .nero .D { color: #F2EFE8; } .nero .A .a2 b, .nero .D b { color: #FF4A1C; }
.carta .A .a2 b, .carta .D b { color: #FF4A1C; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="l A"><div class="a1">Che</div><div class="a2">Numeri<b>!</b></div></div>
<div class="l B"><svg viewBox="0 0 760 760">
  <path d="M120 110 h520 a70 70 0 0 1 70 70 v330 a70 70 0 0 1 -70 70 h-300 l-150 120 l20 -120 h-90 a70 70 0 0 1 -70 -70 v-330 a70 70 0 0 1 70 -70 z" fill="#FFF4EA" stroke="#121212" stroke-width="26" stroke-linejoin="round"/>

  <text x="600" y="470" font-family="Shoulders" font-weight="700" font-size="330" fill="#FF4A1C">!</text>
</svg></div>
<div class="l C"><svg viewBox="0 0 780 780">
  <!-- occhi sgranati: la reazione "che numeri!" -->
  <path d="M150 215 q95 -95 190 -20" fill="none" stroke="#121212" stroke-width="34" stroke-linecap="round"/>
  <path d="M440 195 q95 -75 190 20" fill="none" stroke="#121212" stroke-width="34" stroke-linecap="round"/>
  <ellipse cx="250" cy="430" rx="125" ry="165" fill="#FFF4EA" stroke="#121212" stroke-width="30"/>
  <ellipse cx="530" cy="430" rx="125" ry="165" fill="#FFF4EA" stroke="#121212" stroke-width="30"/>
  <circle cx="275" cy="470" r="64" fill="#121212"/>
  <circle cx="555" cy="470" r="64" fill="#121212"/>
  <circle cx="250" cy="445" r="20" fill="#FFF4EA"/>
  <circle cx="530" cy="445" r="20" fill="#FFF4EA"/>
</svg></div>
<div class="l D">C<b>!</b></div>
<div class="grain"></div>
<script>
const q = new URLSearchParams(location.search);
document.body.className = q.get('t') || 'arancio';
document.querySelector('.' + (q.get('l') || 'A')).style.display = (q.get('l') === 'D') ? 'flex' : 'block';
</script>
</body>
</html>
